<!doctype html>
<html lang="es-CL" data-theme="light" data-theme-preference="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>Turno · Demostración de interfaz</title>
<script>
  // Session-only theme bootstrap: runs before the first paint. Reads no storage and performs no network request.
  (function () {
    var root = document.documentElement;
    var dark = false;
    try { dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); } catch (e) { dark = false; }
    root.dataset.theme = dark ? 'dark' : 'light';
    root.dataset.themePreference = 'system';
  })();
</script>
</head>
<body><a class="skip" href="#main">Saltar al contenido</a>
<div id="root"></div>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>

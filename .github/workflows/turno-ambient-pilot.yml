name: Turno ambient pilot (synthetic only)
on:
  push:
    branches: [feature/opencode-secure-config]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check syntax and synthetic tests (no secrets)
        working-directory: server
        env:
          TURNO_AI_ENABLED: '0'
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run demo
      - name: Frontend v5 baseline (unmodified preview)
        working-directory: prototypes/frontend-v5
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          python3 scripts/build_preview.py
          node scripts/check_portable.mjs

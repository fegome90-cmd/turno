name: Turno ambient pilot (synthetic only)
on:
  push:
    branches: [main, feature/opencode-secure-config]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Secret scan (no .env files or key-shaped strings in tracked files)
        working-directory: server
        run: node scripts/check-secrets.mjs
      - name: Check syntax and synthetic tests (no secrets)
        working-directory: server
        env:
          TURNO_AI_ENABLED: '0'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run demo
          npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Strands Evals contract and negative tests (no inference)
        working-directory: server
        env:
          TURNO_AI_ENABLED: '0'
          STRANDS_EVALS_PYTHON: ${{ runner.temp }}/turno-evals/bin/python
        run: |
          python -m venv "$RUNNER_TEMP/turno-evals"
          "$STRANDS_EVALS_PYTHON" -m pip install -r eval/strands/requirements.lock
          npm run verify:evals
      - name: Frontend v5 baseline (unmodified preview)
        working-directory: prototypes/frontend-v5
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          python3 scripts/build_preview.py
          node scripts/check_portable.mjs
